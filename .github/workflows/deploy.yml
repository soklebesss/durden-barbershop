# Builds the Next.js static export and deploys it to GitHub Pages.
# ponytail: the two NEXT_PUBLIC_SUPABASE_* values are the browser-safe anon
# credentials — they are baked into the shipped client bundle either way, so
# they are not secrets. Move them to repo secrets if you prefer, then swap the
# literals below for ${{ secrets.NAME }}.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /durden-barbershop
      NEXT_PUBLIC_SUPABASE_URL: https://brctriiajzycycspiopb.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJyY3RyaWlhanp5Y3ljc3Bpb3BiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNzkxNjcsImV4cCI6MjA5ODg1NTE2N30.IGm4SVzIuBc_SBAEvoWeziFx9Yp30Nn4VfJn7vwd4UU
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Disable Jekyll (serve _next/*)
        run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
